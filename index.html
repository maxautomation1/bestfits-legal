<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fashion Automation</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      line-height: 1.8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #111;
      border-bottom: 1px solid #222;
      padding: 20px 40px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    header .logo-box {
      width: 42px;
      height: 42px;
      background: #fff;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      color: #000;
      letter-spacing: -0.5px;
    }
    header .app-name {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.3px;
    }
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 80px 30px;
    }
    .hero .logo-box-large {
      width: 80px;
      height: 80px;
      background: #fff;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 26px;
      color: #000;
      margin-bottom: 28px;
    }
    .hero h1 {
      font-size: 42px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 16px;
      letter-spacing: -1px;
    }
    .hero p {
      font-size: 17px;
      color: #666;
      max-width: 480px;
      margin-bottom: 48px;
    }
    .links {
      display: flex;
      gap: 16px;
    }
    .links a {
      padding: 12px 28px;
      border: 1px solid #333;
      border-radius: 8px;
      color: #aaa;
      text-decoration: none;
      font-size: 15px;
      transition: all 0.2s;
    }
    .links a:hover {
      border-color: #666;
      color: #fff;
    }
    footer {
      text-align: center;
      padding: 30px;
      font-size: 13px;
      color: #444;
      border-top: 1px solid #1a1a1a;
    }
  </style>
</head>
<body>

<header>
  <div class="logo-box">FA</div>
  <span class="app-name">Fashion Automation</span>
</header>

<div class="hero">
  <div class="logo-box-large">FA</div>
  <h1>Fashion Automation</h1>
  <p>A fashion content automation tool that posts daily outfit inspiration sliders to TikTok.</p>
  <div class="links">
    <a href="terms.html">Terms of Service</a>
    <a href="privacy.html">Privacy Policy</a>
  </div>
</div>

<footer>
  &copy; 2026 Fashion Automation. All rights reserved.
</footer>

</body>
</html>
